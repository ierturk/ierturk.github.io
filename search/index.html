<script src="https://cdnjs.cloudflare.com/ajax/libs/elasticlunr/0.9.5/elasticlunr.min.js" defer></script>
<script src="/search_index.en.js" defer></script>
<script defer>
window.addEventListener('DOMContentLoaded', function () {
  var input = document.getElementById('search-q');
  var out = document.getElementById('search-results');
  var status = document.getElementById('search-status');
  var q0 = new URLSearchParams(location.search).get('q') || '';
  input.value = q0;
  function run(q) {
    out.textContent = '';
    if (!q.trim() || !window.elasticlunr || !window.searchIndex) { status.textContent = ''; return; }
    var idx = elasticlunr.Index.load(window.searchIndex);
    var res = idx.search(q, { bool: 'AND', expand: true }).slice(0, 20);
    status.textContent = res.length + (res.length === 1 ? ' result' : ' results');
    res.forEach(function (r) {
      var li = document.createElement('li');
      var a = document.createElement('a');
      var doc = idx.documentStore.getDoc(r.ref) || {};
      a.href = r.ref; a.textContent = doc.title || r.ref;
      li.appendChild(a);
      out.appendChild(li);
    });
  }
  window.addEventListener('load', function () { run(input.value) });
  input.addEventListener('input', function () { run(input.value) });
});
</script>
